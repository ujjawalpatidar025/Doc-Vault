version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filevault-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_files:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=filevault.settings
      # Per-user limits (defaults: 2 calls/second, 10 MB of storage)
      - RATE_LIMIT_CALLS=2
      - RATE_LIMIT_WINDOW_SECONDS=1
      - USER_STORAGE_LIMIT_BYTES=10485760
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - filevault-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: filevault-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - filevault-network

volumes:
  media_files:

networks:
  filevault-network:
    driver: bridge

